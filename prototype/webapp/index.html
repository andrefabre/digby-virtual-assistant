<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digby — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Digby <span class="tag">prototype</span></h1>
  <p class="disclaimer">UI sketch only — not the MVP delivery artifact. Sample data, not a real plan.</p>
</header>

<section id="pathway" class="card"></section>

<section>
  <h2>Categories</h2>
  <div id="categories" class="grid"></div>
</section>

<section>
  <h2 id="week-label">Weekly Execution Plan</h2>
  <table id="commitments">
    <thead>
      <tr><th>Category</th><th>Commitment</th><th>Hours</th><th>Status</th><th>Reason</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section>
  <h2>Daily check-in</h2>
  <p class="hint">One check-in per day. Mark each commitment done or missed; missed items need a reason code.</p>
  <div id="checkin-status"></div>
  <button id="submit-checkin">Submit check-in</button>
</section>

<script src="/app.js"></script>
</body>
</html>
